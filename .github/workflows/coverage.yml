name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.cargo/config.toml'
      - 'crates/tachyon/katex-header.html'
      - 'justfile'
      - '.github/workflows/coverage.yml'
      - '.github/actions/**'

# Cancel older runs for the same pull request or push ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# This job is outside `ci-required`. It publishes coverage for review, without
# comparing against a baseline or enforcing a coverage floor.
jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          components: llvm-tools-preview
          cargo-tools: cargo-llvm-cov@0.9.1
          cache-suffix: coverage

      # Match the `just coverage` and `just coverage-html` recipes and `rust.yml`'s
      # debug unit and release integration jobs. Report each profile before the
      # next run clears its coverage data. `test-epoch-size` keeps the runs tractable;
      # the production-epoch check stays in `rust.yml`'s epoch-test job.
      - name: Run unit tests with coverage (debug, test-epoch-size)
        # The integration run clears target/llvm-cov, so keep HTML outside it.
        run: |
          cargo llvm-cov --remap-path-prefix --ignore-filename-regex '/[.]cargo/registry/' --workspace --locked --features test-epoch-size --lib --html --output-dir target/coverage-html/lib
          test -s target/coverage-html/lib/html/index.html

      - name: Write unit coverage summary
        run: |
          report=$(cargo llvm-cov report --remap-path-prefix --ignore-filename-regex '/[.]cargo/registry/')
          test -n "$report"
          printf '%s\n' '## Unit test coverage (ubuntu, debug)' '```' "$report" '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Run integration tests with coverage (release, test-epoch-size)
        run: |
          cargo llvm-cov --release --remap-path-prefix --ignore-filename-regex '/[.]cargo/registry/' --workspace --locked --features test-epoch-size --test integration --html --output-dir target/coverage-html/integration
          test -s target/coverage-html/integration/html/index.html

      - name: Write integration coverage summary
        run: |
          report=$(cargo llvm-cov report --release --remap-path-prefix --ignore-filename-regex '/[.]cargo/registry/')
          test -n "$report"
          printf '%s\n' '## Integration test coverage (ubuntu, release)' '```' "$report" '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: target/coverage-html
          retention-days: 30
          if-no-files-found: error
