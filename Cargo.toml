[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

# dependency opt level matters for fft performance in tests
[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unfulfilled_lint_expectations = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
arithmetic_side_effects = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
integer_division = "deny"
modulo_arithmetic = "deny"
wildcard_enum_match_arm = "deny"
else_if_without_else = "deny"
mixed_read_write_in_expression = "deny"
shadow_unrelated = "forbid"
shadow_reuse = "forbid"
shadow_same = "forbid"
as_conversions = "deny"
indexing_slicing = "deny"
panic_in_result_fn = "forbid"
unwrap_in_result = "forbid"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_core = "deny"
std_instead_of_alloc = "deny"
alloc_instead_of_core = "deny"
missing_errors_doc = "warn"
large_stack_arrays = "deny"
use_debug = "deny"
precedence_bits = "warn"
suspicious_xor_used_as_pow = "deny"
dbg_macro = "deny"
float_arithmetic = "forbid"
iter_over_hash_type = "deny"
big_endian_bytes = "deny"
host_endian_bytes = "deny"
unused_result_ok = "deny"
let_underscore_must_use = "deny"
suspicious = { level = "deny", priority = -1 }
large_stack_frames = "warn"
undocumented_unsafe_blocks = "forbid"
disallowed_methods = "forbid"
exhaustive_enums = "warn"
unwrap_used = "forbid"
missing_panics_doc = "warn"
wildcard_imports = "warn"
redundant_clone = "warn"
ref_option = "warn"
needless_for_each = "warn"
format_push_string = "warn"
disallowed_macros = "deny"
missing_enforced_import_renames = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
