[package]
name = "zcash_tachyon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
zcash_tachyon = { path = ".." }

# Detached from the parent workspace, as in cargo-fuzz's template, so
# `cargo build --workspace` and `cargo test --workspace` leave the fuzz targets
# alone.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "bundle_read"
path = "fuzz_targets/bundle_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stamp_read"
path = "fuzz_targets/stamp_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_mutation"
path = "fuzz_targets/wire_mutation.rs"
test = false
doc = false
bench = false
