allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
allow-unwrap-in-tests = true
allow-expect-in-consts = true
allow-unwrap-in-consts = true
suppress-restriction-lint-in-const = true

disallowed-macros = [
  { path = "core::cmp::Eq", reason = "use the derive_more Eq derive" },
]
enforced-import-renames = [{ path = "derive_more::Eq", rename = "TotalEq" }]

# These operators implement field, group, or polynomial arithmetic, not
# unchecked machine-integer arithmetic.
arithmetic-side-effects-allowed = [
  "udon::field::FieldAdapter",
  "udon::curve::AffineAdapter",
  "udon::curve::ProjectiveAdapter",
  "zakura_udon::field::FieldAdapter",
  "zakura_udon::curve::AffineAdapter",
  "zakura_udon::curve::ProjectiveAdapter",
  "zakura_udon::field::consumer::adapter::FieldAdapter",
  "zakura_udon::curve::consumer::adapter::AffineAdapter",
  "zakura_udon::curve::consumer::adapter::ProjectiveAdapter",
  "FieldAdapter",
  "AffineAdapter",
  "ProjectiveAdapter",
  "ValueCommitment",
  "value::ValueCommitment",
  "zcash_tachyon::value::ValueCommitment",
  "NfSeqPoly",
  "primitives::seq::NfSeqPoly",
  "zcash_tachyon::primitives::seq::NfSeqPoly",
]

disallowed-methods = [
  { path = "std::sync::PoisonError::into_inner", reason = "do not access poisoned mutex contents" },
  { path = "std::sync::PoisonError::get_ref", reason = "do not access poisoned mutex contents" },
  { path = "std::sync::PoisonError::get_mut", reason = "do not access poisoned mutex contents" },
  { path = "subtle::CtOption::expect", replacement = "into_option().expect", reason = "mark the transition out of constant time explicitly" },
  { path = "subtle::CtOption::unwrap", replacement = "into_option().unwrap", reason = "mark the transition out of constant time explicitly" },
]
