[package]
name = "zcash_tachyon-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rand = { version = "0.10", default-features = false, features = ["std_rng"] }

[dependencies.zcash_tachyon]
path = ".."
features = ["std"]

# Detach from the parent workspace: cargo-fuzz crates are built with an
# unstable sanitizer flag and their own dependency set.
[workspace]

[profile.release]
debug = 1

[[bin]]
name = "bundle_read"
path = "fuzz_targets/bundle_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stamped_bundle_read"
path = "fuzz_targets/stamped_bundle_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stripped_bundle_read"
path = "fuzz_targets/stripped_bundle_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proof_stamp_read"
path = "fuzz_targets/proof_stamp_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pointer_stamp_read"
path = "fuzz_targets/pointer_stamp_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compact_size_read"
path = "fuzz_targets/compact_size_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "component_read"
path = "fuzz_targets/component_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_pipeline"
path = "fuzz_targets/verify_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify_reject"
path = "fuzz_targets/verify_reject.rs"
test = false
doc = false
bench = false
