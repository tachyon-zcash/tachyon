name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/tachyon/src/**'
      - 'crates/tachyon/Cargo.toml'
      - 'crates/tachyon/fuzz/**'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - '.github/workflows/fuzz.yml'
      - '.github/actions/rust-nightly-setup/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        id: nightly
        uses: ./.github/actions/rust-nightly-setup
        with:
          components: clippy, rustfmt

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: cargo-fuzz@0.13.2

      - name: Cache fuzz build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/tachyon/fuzz/target
          key: fuzz-${{ steps.nightly.outputs.toolchain }}-${{ hashFiles('crates/tachyon/fuzz/Cargo.lock') }}-${{ hashFiles('crates/tachyon/src/**/*.rs', 'crates/tachyon/fuzz/**/*.rs') }}
          restore-keys: |
            fuzz-${{ steps.nightly.outputs.toolchain }}-${{ hashFiles('crates/tachyon/fuzz/Cargo.lock') }}-
            fuzz-${{ steps.nightly.outputs.toolchain }}-

      - name: Check formatting
        working-directory: crates/tachyon/fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo fmt --all -- --check

      - name: Lint
        working-directory: crates/tachyon/fuzz
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo clippy --locked --all-targets -- -D warnings

      # Build each target and replay its committed corpus once, without
      # exploring, so the job fails only on a committed input.
      - name: Build and replay corpora
        working-directory: crates/tachyon
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz run "$target" -- -runs=0
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: crates/tachyon/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
