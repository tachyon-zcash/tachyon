name: Fuzz campaign

on:
  schedule:
    - cron: "17 3 * * 0,3"
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds to fuzz each target
        type: choice
        options: ["600", "1800", "3600"]
        default: "3600"

# Campaigns share the cached corpora, so they run one at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # `just fuzz` runs every target in turn and stops at the first crash.
  fuzz:
    name: Fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DURATION: ${{ inputs.duration || '3600' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install just and cargo-binstall
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: just,cargo-binstall

      - name: Install the fuzz toolchain
        run: just _fuzz_setup

      # Read-only: the pull-request fuzz job in rust.yml saves it.
      - name: Restore fuzz build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/tachyon/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('justfile', 'rust-toolchain.toml', 'crates/tachyon/fuzz/Cargo.lock') }}-${{ hashFiles('crates/tachyon/src/**/*.rs', 'crates/tachyon/fuzz/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ hashFiles('justfile', 'rust-toolchain.toml', 'crates/tachyon/fuzz/Cargo.lock') }}-

      - name: Restore corpora
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: crates/tachyon/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: just fuzz -max_total_time="$DURATION"

      - name: Minimize corpora
        if: always()
        timeout-minutes: 30
        run: just fuzz-cmin

      - name: Save corpora
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: crates/tachyon/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: crates/tachyon/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
