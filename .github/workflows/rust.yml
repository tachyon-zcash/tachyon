name: Rust CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Detect which files changed to conditionally run jobs
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.cargo/config.toml'
              - 'crates/tachyon/katex-header.html'
              - 'crates/tachyon/fuzz/**'
              - 'justfile'
              - '.github/workflows/rust.yml'
              - '.github/actions/**'

  fmt:
    name: rustfmt (nightly)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned nightly rustfmt
        id: nightly
        uses: ./.github/actions/rust-nightly-setup
        with:
          components: rustfmt

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo fmt --all -- --check

      - name: Check fuzz crate formatting
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo fmt --all --manifest-path crates/tachyon/fuzz/Cargo.toml -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - name: Run clippy (no_std)
        run: cargo clippy --workspace --lib --no-default-features --locked -- -D warnings
      - name: Run clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: release
      # `--all-features` enables `test-epoch-size`, which shrinks `EPOCH_SIZE`
      # from 4096 to 64, so the all-features run never sees the shipped epoch
      # size. `--lib` covers it for the cost of the unit tests; the proof
      # integration tests are left to the all-features run, where they are not
      # paying for 64x the epoch.
      - name: Run unit tests (default features)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --all --locked --lib
      - name: Run tests (all features)
        run: cargo test --release --all --locked --all-features

  # The `no_std` build has to be checked against a target that genuinely has no
  # `std`, not just `--no-default-features` on a host triple, which links `std`
  # regardless. Both times this broke it was a dependency reaching `std`
  # through default features, which nothing else here would have caught.
  build-nostd:
    name: build (thumbv7em-none-eabihf, no_std)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          targets: thumbv7em-none-eabihf
          cache-suffix: nostd
      - name: Build for a bare-metal no_std target
        run: cargo build -p zcash_tachyon --lib --locked --no-default-features --target thumbv7em-none-eabihf

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: docs
      - name: Check intra-doc links
        run: cargo doc --no-deps --all --locked --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings --html-in-header crates/tachyon/katex-header.html"

  # Lints the fuzz crate, builds every target and replays its committed corpus
  # once, without exploring, so the job fails only on a committed input. The
  # campaigns are in fuzz-cron.yml.
  fuzz:
    name: fuzz
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install just and cargo-binstall
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: just,cargo-binstall
      - name: Install the fuzz toolchain
        run: just _fuzz_setup
      # The justfile holds the nightly pin.
      - name: Cache fuzz build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/tachyon/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('justfile', 'rust-toolchain.toml', 'crates/tachyon/fuzz/Cargo.lock') }}-${{ hashFiles('crates/tachyon/src/**/*.rs', 'crates/tachyon/fuzz/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ hashFiles('justfile', 'rust-toolchain.toml', 'crates/tachyon/fuzz/Cargo.lock') }}-
      - name: Lint the fuzz crate
        run: cargo clippy --manifest-path crates/tachyon/fuzz/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build and replay
        run: just fuzz -runs=0
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: crates/tachyon/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30

  # Aggregate gate: a single, stable required status check. It always runs —
  # even on non-Rust PRs where every job below is skipped — and fails only if a
  # needed job actually failed or was cancelled (skipped counts as success).
  # Require THIS in the ruleset instead of the individual job names: a skipped
  # matrix job (`test`) reports the un-expanded name `test (${{ matrix.os }})`,
  # so `test (ubuntu-latest)` etc. never report and block non-Rust PRs. The book
  # has its own always-running workflow and is not gated here.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - test
      - build-nostd
      - docs
      - fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        # Pass the expansion through `env` rather than interpolating `${{ }}`
        # directly into `run:`, which zizmor's template-injection audit flags.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "A required job failed or was cancelled:"
          echo "$NEEDS_JSON"
          exit 1
