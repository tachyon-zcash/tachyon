name: Fuzz campaign

on:
  schedule:
    - cron: "17 3 * * 0,3"
  workflow_dispatch:
    inputs:
      duration:
        description: Seconds to fuzz each target
        type: choice
        options: ["600", "1800", "3600"]
        default: "3600"

# Campaigns share each target's cached corpus, so they run one at a time.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The fuzz crate's `[[bin]]` targets, the list `cargo fuzz list` reads.
  targets:
    name: List fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: List
        id: list
        run: |
          targets="$(cargo metadata --no-deps --format-version 1 \
            --manifest-path crates/tachyon/fuzz/Cargo.toml \
            | jq -c '[.packages[].targets[] | select(.kind == ["bin"]) | .name]')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      DURATION: ${{ inputs.duration || '3600' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The release binary, so `just fuzz` doesn't build cargo-fuzz from source.
      - name: Install just and cargo-fuzz
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: just,cargo-fuzz@0.13.2

      - name: Read the nightly pin
        id: pin
        run: echo "nightly=$(just --evaluate _nightly)" >> "$GITHUB_OUTPUT"

      # Read-only, under the key the fuzz job in rust.yml saves; keep the two in
      # step.
      - name: Restore fuzz build
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/tachyon/fuzz/target
          key: ${{ runner.os }}-fuzz-${{ steps.pin.outputs.nightly }}-${{ hashFiles('rust-toolchain.toml', 'crates/tachyon/fuzz/Cargo.lock') }}-${{ hashFiles('crates/tachyon/src/**/*.rs', 'crates/tachyon/fuzz/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-${{ steps.pin.outputs.nightly }}-${{ hashFiles('rust-toolchain.toml', 'crates/tachyon/fuzz/Cargo.lock') }}-

      - name: Restore corpus
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: crates/tachyon/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      # `just fuzz` installs the pinned nightly and cargo-fuzz first.
      - name: Fuzz
        run: just fuzz "$TARGET" -max_total_time="$DURATION"

      - name: Minimize corpus
        if: always()
        timeout-minutes: 15
        run: just fuzz-cmin "$TARGET"

      - name: Save corpus
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: crates/tachyon/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: crates/tachyon/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
