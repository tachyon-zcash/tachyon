[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

# dependency opt level matters for fft performance in tests
[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
arithmetic_side_effects = "allow"
allow_attributes = "forbid"
allow_attributes_without_reason = "forbid"
integer_division = "deny"
modulo_arithmetic = "deny"
wildcard_enum_match_arm = "forbid"
else_if_without_else = "forbid"
mixed_read_write_in_expression = "deny"
shadow_unrelated = "forbid"
shadow_reuse = "forbid"
shadow_same = "forbid"
as_conversions = "deny"
indexing_slicing = "deny"
panic_in_result_fn = "forbid"
unwrap_in_result = "forbid"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
std_instead_of_core = "forbid"
std_instead_of_alloc = "forbid"
alloc_instead_of_core = "forbid"
missing_errors_doc = "deny"
use_debug = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "forbid"
dbg_macro = "warn"
float_arithmetic = "forbid"
iter_over_hash_type = "deny"
big_endian_bytes = "deny"
host_endian_bytes = "deny"
unused_result_ok = "forbid"
let_underscore_must_use = "deny"
suspicious = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "forbid"
disallowed_methods = "forbid"
exhaustive_enums = "warn"
unwrap_used = "forbid"
missing_panics_doc = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
redundant_explicit_links = "deny"

# docs are always built with --document-private-items
private_intra_doc_links = "allow"
