name: Fuzz

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: crates/tachyon/fuzz
    env:
      # cargo-fuzz's libFuzzer instrumentation; keep in step with the justfile.
      # The explicit `--target` below keeps it off build scripts.
      RUSTFLAGS: "--cfg fuzzing -Cpasses=sancov-module -Cllvm-args=-sanitizer-coverage-level=4 -Cllvm-args=-sanitizer-coverage-inline-8bit-counters -Cllvm-args=-sanitizer-coverage-pc-table -Cllvm-args=-sanitizer-coverage-trace-compares -Cdebug-assertions -Coverflow-checks"
      TARGET_TRIPLE: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned nightly
        id: nightly
        uses: ./.github/actions/rust-nightly-setup
        with:
          components: rustfmt

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo fmt --all -- --check

      - name: Build fuzz targets
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo build --release --locked --bins --target "$TARGET_TRIPLE"

      # Each target runs from its committed corpus for a bounded time. New finds
      # go to a scratch directory listed first, so the committed seeds stay
      # read-only. A failing target leaves its input in `artifacts` and its log
      # in `logs`; the loop runs every target before failing the step.
      - name: Run fuzz targets
        run: |
          mkdir -p logs
          failed=()
          for source in fuzz_targets/*.rs; do
            target="$(basename "$source" .rs)"
            mkdir -p "target/corpus/$target" "artifacts/$target"
            status=0
            "target/$TARGET_TRIPLE/release/$target" \
              -max_len=32768 -max_total_time=30 -timeout=10 -rss_limit_mb=2048 \
              -artifact_prefix="artifacts/$target/" \
              "target/corpus/$target" "corpus/$target" \
              > "logs/$target.log" 2>&1 || status=$?
            {
              echo "### \`$target\`: exit $status"
              echo '```'
              tail -n 20 "logs/$target.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then
              failed+=("$target")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::fuzz targets failed: ${failed[*]}"
            exit 1
          fi

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: |
            crates/tachyon/fuzz/artifacts
            crates/tachyon/fuzz/logs
          if-no-files-found: ignore
          retention-days: 30
