name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/tachyon/src/**'
      - 'crates/tachyon/Cargo.toml'
      - 'crates/tachyon/fuzz/**'
      - 'clippy.toml'
      - 'rustfmt.toml'
      - '.github/workflows/fuzz.yml'
      - 'justfile'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install just and cargo-binstall
        uses: taiki-e/install-action@d9be7d8cda89035c9c843f78bd44d4f72d8403d4 # v2.79.7
        with:
          tool: just,cargo-binstall

      # The justfile holds the nightly pin, so it keys the cache.
      - name: Cache fuzz build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/tachyon/fuzz/target
          key: fuzz-${{ hashFiles('justfile', 'crates/tachyon/fuzz/Cargo.lock') }}-${{ hashFiles('crates/tachyon/src/**/*.rs', 'crates/tachyon/fuzz/**/*.rs') }}
          restore-keys: |
            fuzz-${{ hashFiles('justfile', 'crates/tachyon/fuzz/Cargo.lock') }}-

      - name: Lint
        run: cargo clippy --manifest-path crates/tachyon/fuzz/Cargo.toml --locked --all-targets -- -D warnings

      # Build each target and replay its committed corpus once, without
      # exploring, so the job fails only on a committed input. `just fuzz`
      # installs the pinned nightly and cargo-fuzz first.
      - name: Build and replay corpora
        run: |
          for source in crates/tachyon/fuzz/fuzz_targets/*.rs; do
            just fuzz "$(basename "$source" .rs)" -runs=0
          done

      - name: Check formatting
        run: cargo "+$(just --evaluate _nightly)" fmt --all --manifest-path crates/tachyon/fuzz/Cargo.toml -- --check

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-artifacts
          path: crates/tachyon/fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
