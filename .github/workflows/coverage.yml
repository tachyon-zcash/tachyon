name: Test coverage

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.cargo/config.toml'
      - 'crates/tachyon/katex-header.html'
      - '.github/workflows/coverage.yml'
      - '.github/actions/**'

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# Advisory reporting only: this job is outside `ci-required`, has no coverage
# floor, and leaves no PR comment. It publishes a line-coverage report of the
# test suite to the job summary and as a downloadable `lcov.info` artifact.
jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cargo-tools: cargo-llvm-cov@0.9.1
          cache-suffix: coverage

      # The same single run as the `just coverage` recipe, mirroring
      # `rust.yml`'s release all-features test job. `test-epoch-size` shrinks
      # `EPOCH_SIZE` from 4096 to 64 so the instrumented run stays tractable;
      # the production-epoch check stays in `rust.yml`'s default-features
      # unit-test job.
      - name: Clean coverage artifacts
        run: cargo llvm-cov clean --workspace

      - name: Run tests with coverage (release, test-epoch-size)
        run: cargo llvm-cov --no-report --release --workspace --locked --features test-epoch-size

      - name: Generate lcov report
        run: cargo llvm-cov report --release --lcov --output-path lcov.info

      - name: Write summary to the job summary
        run: |
          echo '## Test coverage (ubuntu, release)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --release --summary-only >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30
