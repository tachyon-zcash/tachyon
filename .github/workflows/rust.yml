name: Rust CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs when a new commit is pushed to the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # Detect which files changed to conditionally run jobs
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.cargo/config.toml'
              - 'crates/tachyon/katex-header.html'
              - '.github/workflows/rust.yml'
              - '.github/actions/**'

  fmt:
    name: rustfmt (nightly)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install pinned nightly rustfmt
        id: nightly
        uses: ./.github/actions/rust-nightly-setup
        with:
          components: rustfmt

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.nightly.outputs.toolchain }}
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - name: Run clippy (no_std)
        run: cargo clippy --workspace --lib --no-default-features --locked -- -D warnings
      - name: Run clippy (all features)
        run: cargo clippy --workspace --all-targets --features test-epoch-size --locked -- -D warnings

  # Runs per item in the platform matrix
  test-unit:
    name: unit tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: debug
      - name: Run unit tests
        run: cargo test --workspace --locked --features test-epoch-size --lib

  # Runs without `test-epoch-size` to use large epochs
  test-epoch:
    name: epoch tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: debug
      - name: Run epoch tests
        run: cargo test --workspace --locked --test epoch

  # Runs with `--release` for performance
  test-integration:
    name: integration tests
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: release
      - name: Run integration tests
        run: cargo test --workspace --locked --release --features test-epoch-size --test integration

  # The `no_std` build has to be checked against a target that genuinely has no
  # `std`, not just `--no-default-features` on a host triple, which links `std`
  # regardless. Both times this broke it was a dependency reaching `std`
  # through default features, which nothing else here would have caught.
  build-nostd:
    name: build (thumbv7em-none-eabihf, no_std)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          targets: thumbv7em-none-eabihf
          cache-suffix: nostd
      - name: Build for a bare-metal no_std target
        run: cargo build -p zcash_tachyon --lib --locked --no-default-features --target thumbv7em-none-eabihf

  docs:
    name: docs
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-suffix: docs
      - name: Check intra-doc links
        run: cargo doc --no-deps --all --locked --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings --html-in-header crates/tachyon/katex-header.html"
      - name: Run doctests
        run: cargo test --workspace --locked --doc

  # Aggregate gate: a single, stable required status check. It always runs —
  # even on non-Rust PRs where every job below is skipped — and fails only if a
  # needed job actually failed or was cancelled (skipped counts as success).
  # Require THIS in the ruleset instead of the individual job names: a skipped
  # matrix job (`test-unit`) reports the un-expanded name
  # `unit tests (${{ matrix.os }})`, so `unit tests (ubuntu-latest)` etc. never
  # report and block non-Rust PRs. The book has its own always-running workflow
  # and is not gated here.
  ci-required:
    name: ci-required
    if: always()
    needs:
      - changes
      - fmt
      - clippy
      - test-unit
      - test-epoch
      - test-integration
      - build-nostd
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        # Pass the expansion through `env` rather than interpolating `${{ }}`
        # directly into `run:`, which zizmor's template-injection audit flags.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "A required job failed or was cancelled:"
          echo "$NEEDS_JSON"
          exit 1
